version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: eventify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-astronautdesh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-astronautdesh}
      POSTGRES_DB: ${DB_NAME:-Eventify}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - eventify-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-astronautdesh} -d ${DB_NAME:-Eventify}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventify-network

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: eventify-backend:latest
    container_name: eventify-backend-api
    restart: unless-stopped
    environment:
      - PORT=${BACKEND_PORT:-8081}
      - POSTGRES_URI=postgres://${DB_USER:-astronautdesh}:${DB_PASSWORD:-astronautdesh}@postgres:5432/${DB_NAME:-Eventify}?sslmode=disable
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eventify-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8081}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        - NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}
        - NEXT_PUBLIC_SERVICE_FEE=${NEXT_PUBLIC_SERVICE_FEE:-500}
        - NEXT_PUBLIC_VAT_RATE=${NEXT_PUBLIC_VAT_RATE:-0.075}
    image: eventify-frontend:latest
    container_name: eventify-frontend
    restart: unless-stopped
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - eventify-network

# Named volume for persistent database storage
volumes:
  eventify-data:
    name: eventify-data

# Custom network for inter-container communication
networks:
  eventify-network:
    name: eventify-network
    driver: bridge